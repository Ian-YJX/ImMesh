# ImMesh Multi-session Mesh-only config for GEODE stairs
# LIO disabled: only subscribes /cloud_registered for Mesh + loads alpha PCD offline

feature_extract_enable : 0
point_filter_num : 1
max_iteration : 4
dense_map_enable : 1
filter_size_surf : 0.1
filter_size_map : 0.4
cube_side_length : 1000
debug : 0
min_img_count : 150000
grid_size : 40
patch_size : 8
img_enable : 0
lidar_enable : 0                # Mesh-only mode: LIO disabled
outlier_threshold : 1000
img_point_cov : 100
laser_point_cov : 0.001

common:
    lidar_topic: "/velodyne_points"
    imu_topic:   "/imu/data"
    mesh_topic:  "/cloud_registered"
    odom_topic:  "/aft_mapped_to_init"

preprocess:
    point_filter_num: 1
    filter_size_surf: 0.1
    cloud_type: 2               # VELO16 (not actually used in mesh-only mode)
    scan_line: 16
    timestamp_unit: 2
    blind: 0.8

mapping:
    imu_en: false               # Mesh-only mode: IMU disabled
    imu_int_frame: 30
    acc_cov: 0.5
    gyr_cov: 0.3
    b_acc_cov: 0.0001
    b_gyr_cov: 0.0001
    fov_degree: 360
    extrinsic_T: [ 0.049258, -0.012500, 0.026946 ]
    extrinsic_R: [  0.999620,  0.027463,  0.002445,
                   -0.027517,  0.999299,  0.025398,
                   -0.001746, -0.025456,  0.999674]

voxel:
    voxel_map_en: true
    pub_plane_en: false
    dept_err: 0.02
    beam_err: 0.05
    min_eigen_value: 0.0025
    match_s: 0.9
    sigma_num: 3
    voxel_size: 0.5
    max_layer: 2
    max_points_size: 50
    layer_init_size: [5,5,5,5,5]

publish:
    path_en:  false
    scan_publish_en:  true
    dense_publish_en: false
    scan_bodyframe_pub_en: false
    effect_point_pub: false

meshing:
    distance_scale: 1.0
    points_minimum_scale: 0.1
    voxel_resolution: 0.4
    region_size: 10.0
    number_of_pts_append_to_map: 50000000  # 需要大值以保证离线 PCD 全量入图
    if_draw_mesh: 1
    enable_mesh_rec: 1

