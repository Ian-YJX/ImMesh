# ImMesh Mesh-only 离线配置 (仿真用)
# 禁用 LiDAR 里程计和 IMU，仅做 PCD → Mesh 重建

feature_extract_enable : 0
point_filter_num : 1
max_iteration : 4
dense_map_enable : 1
filter_size_surf : 0.4
filter_size_map : 0.4
cube_side_length : 1000
debug : 0
min_img_count : 150000
grid_size : 40
patch_size : 8
img_enable : 0
lidar_enable : 0                # 禁用 LiDAR 里程计
outlier_threshold : 78
img_point_cov : 1000
laser_point_cov : 0.001
pcd_file: "/root/catkin_ws/src/STD/data_simu/blue/blue_merged.pcd"
common:
    lid_topic:  "/livox/lidar"
    imu_topic:  "/livox/imu"

preprocess:
    lidar_type: 1
    scan_line: 6
    blind: 1

mapping:
    imu_en: false               # 禁用 IMU
    imu_int_frame: 30
    acc_cov: 0.5
    gyr_cov: 0.3
    b_acc_cov: 0.01
    b_gyr_cov: 0.01
    fov_degree: 180
    extrinsic_T: [ 0, 0, 0 ]
    extrinsic_R: [ 1, 0, 0,
                   0, 1, 0,
                   0, 0, 1]

publish:
    path_en:  false
    scan_publish_en:  false
    dense_publish_en: false
    scan_bodyframe_pub_en: false
    effect_point_pub: false

meshing:
    distance_scale: 1.0
    points_minimum_scale: 0.1
    voxel_resolution: 0.4
    region_size: 10.0
    number_of_pts_append_to_map: 50000000
    if_draw_mesh: 1
    enable_mesh_rec: 1
