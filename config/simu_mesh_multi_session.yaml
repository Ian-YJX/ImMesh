# ImMesh Multi-session Mesh-only 配置 (仿真用)
# 禁用 LIO：不订阅 LiDAR/IMU、不运行状态估计、不发布 TF
# 仅订阅 mesh_topic (/cloud_registered) 做 Mesh 重建 + 离线加载 PCD

feature_extract_enable : 0
point_filter_num : 1
max_iteration : 4
dense_map_enable : 1
filter_size_surf : 0.1
filter_size_map : 0.4
cube_side_length : 1000
debug : 0
min_img_count : 150000
grid_size : 40
patch_size : 8
img_enable : 0
lidar_enable : 0                # Mesh-only 模式：禁用 LIO
outlier_threshold : 1000
img_point_cov : 100
laser_point_cov : 0.001

common:
    lidar_topic: "/os1_cloud_node/points"  # 原始 LiDAR (驱动 ImMesh LIO)
    imu_topic:   "/imu"                    # 原始 IMU
    mesh_topic:  "/cloud_registered"       # FAST-LIVO2 发布的全局注册点云 → Mesh 重建
    odom_topic:  "/aft_mapped_to_init"     # FAST-LIVO2 发布的里程计

preprocess:
    point_filter_num: 1
    filter_size_surf: 0.1
    cloud_type: 6               # VELO32: 兼容仿真 Ouster (x,y,z,intensity,ring,time)
    scan_line: 6
    timestamp_unit: 2
    blind: 0.8

mapping:
    imu_en: false               # Mesh-only 模式：禁用 IMU
    imu_int_frame: 30
    acc_cov: 0.5
    gyr_cov: 0.3
    b_acc_cov: 0.0001
    b_gyr_cov: 0.0001
    fov_degree: 180
    extrinsic_T: [ 0.0, 0.0, 0.722 ]     # IMU→LiDAR (恢复正确值，mesh_body 不经此路径)
    extrinsic_R: [ 1, 0, 0,
                   0, 1, 0,
                   0, 0, 1]

voxel:
    voxel_map_en: true
    pub_plane_en: false
    dept_err: 0.02
    beam_err: 0.05
    min_eigen_value: 0.0025
    match_s: 0.9
    sigma_num: 3
    voxel_size: 0.5
    max_layer: 2
    max_points_size: 50
    layer_init_size: [5,5,5,5,5]

publish:
    path_en:  false
    scan_publish_en:  true
    dense_publish_en: false
    scan_bodyframe_pub_en: false
    effect_point_pub: false

meshing:
    distance_scale: 1.0
    points_minimum_scale: 0.1
    voxel_resolution: 0.4
    region_size: 10.0
    number_of_pts_append_to_map: 50000000  # 需要大值以保证离线 PCD 全量入图
    if_draw_mesh: 1
    enable_mesh_rec: 1
