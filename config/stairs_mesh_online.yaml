# ImMesh online Mesh config for GEODE stairs_alpha (Velodyne VLP-16)
# ImMesh runs its own LIO + receives /cloud_registered from FAST-LIVO2 for Mesh

feature_extract_enable : 0
point_filter_num : 1
max_iteration : 4
dense_map_enable : 1
filter_size_surf : 0.1
filter_size_map : 0.4
cube_side_length : 1000
debug : 0
min_img_count : 150000
grid_size : 40
patch_size : 8
img_enable : 0
lidar_enable : 1                # LiDAR drives ImMesh main loop
outlier_threshold : 1000
img_point_cov : 100
laser_point_cov : 0.001

common:
    lidar_topic: "/velodyne_points"
    imu_topic:   "/imu/data"
    mesh_topic:  "/cloud_registered"
    odom_topic:  "/aft_mapped_to_init"

preprocess:
    point_filter_num: 1
    filter_size_surf: 0.1
    cloud_type: 2               # VELO16
    scan_line: 16
    timestamp_unit: 2
    blind: 0.8

mapping:
    imu_en: true
    imu_int_frame: 30
    acc_cov: 0.5
    gyr_cov: 0.3
    b_acc_cov: 0.0001
    b_gyr_cov: 0.0001
    fov_degree: 360
    extrinsic_T: [ 0.010965, -0.086864, 0.060426 ]
    extrinsic_R: [ 0.9989892,  0.0444870, -0.0064406,
                  -0.0446353,  0.9986885, -0.0250789,
                   0.0053164,  0.0253410,  0.9996647]

voxel:
    voxel_map_en: true
    pub_plane_en: false
    dept_err: 0.02
    beam_err: 0.05
    min_eigen_value: 0.0025
    match_s: 0.9
    sigma_num: 3
    voxel_size: 0.5
    max_layer: 2
    max_points_size: 50
    layer_init_size: [5,5,5,5,5]

publish:
    path_en:  false
    scan_publish_en:  true
    dense_publish_en: false
    scan_bodyframe_pub_en: false
    effect_point_pub: false

meshing:
    distance_scale: 1.0
